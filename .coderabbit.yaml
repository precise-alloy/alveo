chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/skills/**/SKILL.md'
      - 'docs/CODE_CONVENTIONS.md'
      - 'docs/TEST_CONVENTIONS.md'
      - 'docs/test-coverage.md'
      - 'docs/ARCHITECTURE.md'
      - '**/AGENT.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/GEMINI.md'
      - '**/REVIEW.md'
      - '**/.cursorrules'
      - '**/.cursor/rules/*'
      - '**/.windsurfrules'
      - '**/.clinerules/*'
      - '**/.rules/*'
  learnings:
